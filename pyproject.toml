# SPDX-PackageSummary: finnix-mirrors-website
# SPDX-FileCopyrightText: Copyright (C) 2020-2025 Ryan Finnie
# SPDX-License-Identifier: MPL-2.0
[project]
name = "finnix-mirrors"
authors = [
    {name = "Ryan Finnie", email = "ryan@finnie.org"},
]
description = "mirrors.finnix.org"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MPL-2.0"}
dependencies = [
    "Django",
    "django[argon2]",
    "django-xff",
    "requests",
    "python-dateutil",
    "geoip2",
    "geopy",
    "tzdata",
]
dynamic = ["version"]

[project.optional-dependencies]
gunicorn = ["gunicorn"]

[tool.setuptools.packages.find]
include = [
    "finnixmirrors",
    "finnixmirrors.migrations",
    "finnixmirrors.management.commands",
    "finnixmirrors.tests",
]

[tool.black]
line-length = 132

# https://pypi.org/project/Flake8-pyproject/
[tool.flake8]
max-line-length = 132
